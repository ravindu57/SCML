version: "3.9"

services:
  # ── TrustMediator mediation service ────────────────────────────────────────
  trust-mediator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trust-mediator
    ports:
      - "8000:8000"
    # Secrets/tunables come from .env on disk (immune to shell-env shadowing);
    # the environment: block below still overrides where explicitly set.
    env_file:
      - path: .env
        required: false
    environment:
      # No default credentials (security review §8): compose refuses to start
      # until POSTGRES_PASSWORD and REDIS_PASSWORD are set, in .env or the
      # shell. Generate: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      # URL-safe values only: they are interpolated into these URLs unencoded.
      # POSTGRES_PASSWORD applies only when the volume is first created; for an
      # existing volume run ALTER USER tmuser PASSWORD '...' first.
      - DATABASE_URL=postgresql+asyncpg://tmuser:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/trust_mediator
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      - TRUST_MEDIATOR_ENV=production
      # NFR-SEC-03: this stack terminates TLS at nginx, so the app itself
      # serves plaintext on the internal network. Production refuses to start
      # without this acknowledgement — set TRUST_MEDIATOR_TLS_CERT_FILE and
      # TRUST_MEDIATOR_TLS_KEY_FILE instead to encrypt this hop as well.
      - TRUST_MEDIATOR_ALLOW_INSECURE_HTTP=true
      - TRUST_MEDIATOR_LOG_LEVEL=INFO
      # API keys come from .env: TRUST_MEDIATOR_API_KEYS for agents and a
      # separate TRUST_MEDIATOR_ADMIN_API_KEYS for policy and quarantine
      # changes. Production with no data-plane keys refuses every call; with
      # no admin keys the control plane is closed.
      - MEMORY_INTEGRITY_THRESHOLD=${MEMORY_INTEGRITY_THRESHOLD:-0.65}
      - SCANNER_BACKEND=${SCANNER_BACKEND:-heuristic}
      - POLICY_DEFAULT_FILE=policies/default_policy.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./policies:/app/policies:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trust-mediator-postgres
    environment:
      POSTGRES_USER: tmuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: trust_mediator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published: only the mediator, on the compose network, needs it.
    # For local inspection bind to loopback, e.g. "127.0.0.1:5432:5432".
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmuser -d trust_mediator"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trust-mediator-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    # Not published (see postgres). Rate-limit counters live here, so an
    # unauthenticated Redis lets anyone reset them.
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

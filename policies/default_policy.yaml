# Default declarative security policy for TrustMediator v1.0
# Edit via PUT /v1/policy or replace this file before startup.
# All thresholds are calibrated conservatively; tune via shadow mode first.

agents:
  # Default policy applied to any agent_id not explicitly listed
  default:
    allowed_tools: []                    # Empty = deny all tool calls (safest default)
    require_approval_for:
      - irreversible
      - high_impact
    untrusted_arg_policy: require_approval   # deny | require_approval | allow
    rate_limits:
      tool_calls_per_minute: 60

  # Example: a web-search agent with a limited tool set
  web_search_agent:
    allowed_tools:
      - web_search
      - summarise
    require_approval_for:
      - irreversible
      - high_impact
    untrusted_arg_policy: require_approval
    rate_limits:
      tool_calls_per_minute: 30
    tool_configs:
      web_search:
        argument_schema:
          type: object
          properties:
            query:
              type: string
              maxLength: 500
          required: [query]
        argument_constraints:
          query:
            max_length: 500

  # Example: an email agent with strict approval gates
  email_agent:
    allowed_tools:
      - read_email
      - send_email
      - draft_email
    require_approval_for:
      - irreversible
      - high_impact
      - send_email          # Always require approval to send
    untrusted_arg_policy: deny       # Never use untrusted args for email operations
    rate_limits:
      tool_calls_per_minute: 10

  # ── Truelane — autonomous freight brokerage, one agent per workflow ───────
  #
  # Each of the eight workflows authorises under its own agent id rather than
  # a shared "truelane" identity. A shared identity means the allow-list is the
  # union of everything any workflow needs, so W8 reporting can reach the
  # invoicing tool and only good manners stop it. Splitting the identity makes
  # that structurally impossible, which is what least agency actually means.
  #
  # Note what is NOT here: `dispatch_load`, on any workflow. Committing a
  # carrier to a load is the action an injected instruction most wants, and no
  # workflow needs to do it unattended. Absence from every list is the control
  # — there is no rule to misconfigure.
  #
  # `untrusted_arg_policy: allow` on the operational workflows is deliberate.
  # Every Truelane argument derives from a broker email — that is the job — so
  # `require_approval` there gates everything including routine quoting, which
  # is the same as having no automation. The label is still applied and still
  # audited; the controls doing the work are the narrow allow-lists and the
  # explicit approval gates below. This is per-agent tuning of the rule, not
  # dropping argument_trust_labels at the call site, which would blind every
  # other rule too.

  # W1 — email intake, classification, quoting. Reads and drafts only.
  truelane-w1:
    allowed_tools: [classify_email, quote_load, send_quote_email]
    require_approval_for: [irreversible, high_impact]
    untrusted_arg_policy: allow
    rate_limits: { tool_calls_per_minute: 60 }

  # W2 — carrier sourcing and vetting. Read-only against external registries.
  truelane-w2:
    allowed_tools: [search_carriers, check_carrier_credit]
    require_approval_for: [irreversible, high_impact]
    untrusted_arg_policy: allow
    rate_limits: { tool_calls_per_minute: 60 }

  # W3 — rate confirmation. Sends the paperwork; does NOT commit the carrier.
  truelane-w3:
    allowed_tools: [send_rate_confirmation]
    require_approval_for: [irreversible, high_impact]
    untrusted_arg_policy: allow
    rate_limits: { tool_calls_per_minute: 30 }

  # W4 — in-transit tracking. Status updates only.
  truelane-w4:
    allowed_tools: [update_tracking]
    require_approval_for: [irreversible, high_impact]
    untrusted_arg_policy: allow
    rate_limits: { tool_calls_per_minute: 120 }

  # W5 — document parsing (PODs, BOLs). Handles the most hostile input in the
  # system and holds no authority to act on it.
  truelane-w5:
    allowed_tools: [parse_document, store_document]
    require_approval_for: [irreversible, high_impact]
    untrusted_arg_policy: allow
    rate_limits: { tool_calls_per_minute: 60 }

  # W6 — invoicing. The money workflow: one tool, gated explicitly, and
  # arguments derived from untrusted input must reach a human first.
  truelane-w6:
    allowed_tools: [create_invoice]
    require_approval_for: [irreversible, high_impact, create_invoice]
    untrusted_arg_policy: require_approval
    rate_limits: { tool_calls_per_minute: 20 }

  # W7 — collections. Chases customers, so every send is gated.
  truelane-w7:
    allowed_tools: [send_collection_notice]
    require_approval_for: [irreversible, high_impact, send_collection_notice]
    untrusted_arg_policy: require_approval
    rate_limits: { tool_calls_per_minute: 20 }

  # W8 — reporting. Internal reads; deliberately the weakest identity here.
  truelane-w8:
    allowed_tools: [generate_report]
    require_approval_for: [irreversible, high_impact]
    untrusted_arg_policy: allow
    rate_limits: { tool_calls_per_minute: 30 }

  # NOTE: there is no bare `truelane` agent. A caller that is not a recognised
  # workflow sends that id, matches nothing, and falls back to `default` —
  # deny-all. An unrecognised caller must not inherit authority.
    rate_limits:
      tool_calls_per_minute: 60

memory:
  integrity_score_threshold: 0.65    # Below this → quarantine; below half → reject
  rescan_on_read: false              # Set true for high-security deployments

scanner:
  shadow_mode: false                 # true = log but do not enforce (for rollout)
  thresholds:
    block: 0.85                      # Definite injection — block and audit
    escalate: 0.70                   # Probable injection — escalate for review
    transform: 0.50                  # Possible injection — sanitise (RISKY_EXTERNAL)

redaction:
  pii_patterns_enabled: true
  entropy_threshold: 4.5             # Shannon entropy threshold for secret detection
  protected_classes:
    - pii
    - secret
    - credential
  # data_flow_rules defines which protected classes can flow to which destinations
  # Omitting this means no extra flow restrictions beyond redaction
  data_flow_rules: {}

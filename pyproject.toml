[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-mediator"
version = "1.0.0"
description = "TrustMediator — A Trust-Aware Context Mediation Middleware for Securing Agentic AI and RAG Systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TrustMediator Project", email = "project@trustmediator.dev" }]
keywords = ["llm", "security", "prompt-injection", "rag", "agent", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",           # SQLite async driver (dev fallback)
    "asyncpg>=0.29.0",             # PostgreSQL async driver (production)
    "alembic>=1.13.0",
    # Caching
    "redis[asyncio]>=5.0.0",
    # Observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.20.0",
    "structlog>=24.2.0",
    # Security / scanning utilities
    "scikit-learn>=1.5.0",         # TF-IDF + logistic regression classifier
    "numpy>=1.26.0",
    # Policy
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
    # HTTP client (for SIEM forwarding, approval gates)
    "httpx>=0.27.0",
    # Async utilities
    "anyio>=4.4.0",
    "tenacity>=8.4.0",
    # Rate limiting
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "fakeredis>=2.23.0",
]
langchain = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
]
kafka = [
    "aiokafka>=0.10.0",
]
# Span export for NFR-OBS-01. The API/SDK ship in the core deps so the
# instrumentation is always compiled in; only the OTLP wire exporter is
# optional, since a deployment may scrape traces some other way.
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]
grpc = [
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
]

[project.scripts]
trust-mediator = "trust_mediator.api.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trust_mediator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["trust_mediator/api/grpc/mediation_pb2*.py"]  # protoc-generated

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

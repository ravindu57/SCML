apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trust-mediator
  namespace: trust-mediator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trust-mediator
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

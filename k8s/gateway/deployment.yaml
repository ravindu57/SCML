apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-mediator
  namespace: trust-mediator
  labels:
    app.kubernetes.io/name: trust-mediator
    app.kubernetes.io/component: gateway
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trust-mediator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trust-mediator
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      # Spread replicas across nodes — no single point of failure (NFR-AVAIL-02)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trust-mediator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mediator
          image: trust-mediator:1.0.0   # replace with your registry path
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: trust-mediator-config
            - secretRef:
                name: trust-mediator-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # ── Rotatable API keys (NFR-SEC-04) ──────────────────────────────
            # Keys currently arrive as TRUST_MEDIATOR_API_KEYS via the
            # `trust-mediator-secrets` envFrom above. Environment variables
            # sourced from a Secret are snapshotted at pod start: kubelet never
            # updates them, so rotating or revoking a key needs a rolling
            # restart. A *volume-mounted* Secret is refreshed in place
            # (kubelet sync period, ~60s by default), which is what lets the
            # mediator pick up a new key set while serving.
            #
            # To enable: create the Secret, uncomment this mount and the volume
            # below, and set in the ConfigMap:
            #   TRUST_MEDIATOR_API_KEYS_FILE: "/etc/trust-mediator/keys/api-keys"
            # Do all three together — the file source takes precedence over the
            # env var, so pointing at a path that is not mounted revokes every
            # key at once.
            # - name: api-keys
            #   mountPath: /etc/trust-mediator/keys
            #   readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        # Paired with the api-keys volumeMount above — see the note there.
        # One key per line; "name:key" to attribute admin actions in the audit
        # chain. Rotate by adding the new key, then removing the old. Revoke by
        # emptying the file: deleting it is indistinguishable from a broken
        # mount, so the mediator keeps the last good key set in that case.
        # - name: api-keys
        #   secret:
        #     secretName: trust-mediator-api-keys
        #     items:
        #       - key: api-keys
        #         path: api-keys

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Force deterministic dev-mode config in CI regardless of any .env
  TRUST_MEDIATOR_ENV: development
  DATABASE_URL: ""
  REDIS_URL: ""
  TRUST_MEDIATOR_API_KEYS: ""
  TRUST_MEDIATOR_ADMIN_API_KEYS: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to the version in pyproject's [dev] extra, so a new ruff
      # release cannot fail CI on code that lints clean locally.
      - run: pip install "ruff==0.15.22"
      - run: ruff check trust_mediator/ scml/ tests/ benchmarks/affordance_detector/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,kafka]"   # [dev] includes grpc
      - run: pytest tests/ -q --cov=trust_mediator --cov-report=term-missing
      - name: Enforce Must-requirement test floor
        run: |
          # All unit suites map to PRD FR-IDs; a shrinking suite is a red flag.
          count=$(pytest tests/ --collect-only -q 2>/dev/null | grep -oE '[0-9]+ tests collected' | grep -oE '[0-9]+' || echo 0)
          echo "collected $count tests"
          test "$count" -ge 860

  # The core install is the client SDK. This job is the only thing keeping it
  # that way: a bare `pip install .` must not drag in the server stack, or
  # adding SCML to somebody's agent goes back to being a ~400 MB decision.
  client-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the core (client) distribution only
        run: pip install .
      - name: Core install must import without the server stack
        run: |
          python - <<'PY'
          import importlib.util, sys

          import scml
          import trust_mediator
          print("imported trust_mediator", trust_mediator.__version__)
          assert scml.__version__ == trust_mediator.__version__
          assert scml.SCMLClient is trust_mediator.SCMLClient
          print("scml alias resolves against a client-only install")

          # If any of these resolve, a [server]/[ml] dependency has leaked back
          # into `dependencies` in pyproject.toml.
          server_only = ("fastapi", "uvicorn", "sqlalchemy", "redis",
                         "sklearn", "structlog", "prometheus_client")
          leaked = []
          for name in server_only:
              try:
                  if importlib.util.find_spec(name) is not None:
                      leaked.append(name)
              except (ImportError, ValueError):
                  pass
          if leaked:
              sys.exit(f"server dependencies leaked into the core install: {leaked}")
          print("core install is thin")
          PY

  # The TypeScript client mirrors the Python SDK's verdict classification, and
  # the two demo services are what the README tells people to run. None was
  # built in CI, so a type error or a broken client test shipped silently.
  typescript-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  typescript-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orchestrator, demo-agent]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      # The services depend on file:../clients/typescript, whose dist/ is
      # gitignored: build it first or tsc cannot find 'scml-client'.
      - run: npm ci && npm run build
        working-directory: clients/typescript
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t trust-mediator:ci .
      - name: Smoke test container
        run: |
          docker run -d --name tm -p 8000:8000 \
            -e TRUST_MEDIATOR_ENV=development -e DATABASE_URL="" trust-mediator:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "health check never passed"; docker logs tm; exit 1

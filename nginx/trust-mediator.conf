# nginx/trust-mediator.conf
# Nginx reverse proxy config for TrustMediator.
# Install: sudo cp nginx/trust-mediator.conf /etc/nginx/sites-available/trust-mediator
#          sudo ln -s /etc/nginx/sites-available/trust-mediator /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream trust_mediator_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting zone (10 MB shared memory, 30 requests/second per IP)
limit_req_zone $binary_remote_addr zone=tm_api:10m rate=30r/s;

server {
    listen 80;
    server_name localhost trust-mediator.local;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Max request body size (prevent large-payload injection attempts)
    client_max_body_size 2m;

    # API proxy
    location /v1/ {
        limit_req zone=tm_api burst=60 nodelay;

        proxy_pass http://trust_mediator_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Buffering off for streaming support
        proxy_buffering off;
    }

    # Health endpoint (no rate limit)
    location /health {
        proxy_pass http://trust_mediator_backend/health;
        proxy_set_header Host $host;
    }

    # Swagger UI + ReDoc (restrict to internal networks in production)
    location ~ ^/(docs|redoc|openapi\.json) {
        # Uncomment to restrict to internal only:
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny all;
        proxy_pass http://trust_mediator_backend;
        proxy_set_header Host $host;
    }

    # Prometheus metrics (restrict to monitoring systems)
    location /metrics {
        # Uncomment and set your monitoring IP:
        # allow 10.0.0.10/32;
        # deny all;
        proxy_pass http://trust_mediator_backend/metrics;
        proxy_set_header Host $host;
    }

    # Deny everything else
    location / {
        return 404;
    }
}
